<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Packing list</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 3rem auto; padding: 0 1rem; }
      ul { list-style: none; padding: 0; }
      li { padding: 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>Packing list</h1>
    <ul id="items">
      <li><label><input type="checkbox"> Passport</label></li>
      <li><label><input type="checkbox"> Charger</label></li>
      <li><label><input type="checkbox"> Toothbrush</label></li>
      <li><label><input type="checkbox"> Rain jacket</label></li>
      <li><label><input type="checkbox"> A book</label></li>
    </ul>
  </body>
</html>
