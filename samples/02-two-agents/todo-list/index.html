<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To do</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; font-size: 1rem; padding: 0.4rem; }
      button { font-size: 1rem; padding: 0.4rem 1rem; }
    </style>
  </head>
  <body>
    <h1>To do</h1>
    <form id="new">
      <input id="item" placeholder="Something to do" autocomplete="off">
      <button id="add" type="submit">Add</button>
    </form>
    <ul id="items"></ul>
    <script>
      const items = document.getElementById("items");
      const item = document.getElementById("item");
      document.getElementById("new").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!item.value.trim()) return;
        const entry = document.createElement("li");
        entry.textContent = item.value.trim();
        items.append(entry);
        item.value = "";
      });
    </script>
  </body>
</html>
