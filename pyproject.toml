[project]
name = "halyard-fleet"
version = "0.5.0"
description = "A control plane for orchestrating coding agents remotely."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
halyard = "halyard.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # So a hung test is a failure with a traceback rather than a job that runs
    # for fourteen minutes and is cancelled by a person watching a spinner.
    # That happened, and the log said nothing at all: progress stopped at 32%
    # and the next line was "The operation was canceled."
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    # Drives the app's lifespan in tests, so startup and shutdown are exercised
    # rather than skipped — shutdown is where open approvals get denied.
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halyard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Generous: the whole suite runs in about forty-five seconds, so any single
# test reaching this is stuck rather than slow. `thread` rather than `signal`
# because much of this suite is async and signal-based timeouts do not
# interrupt a blocked await.
timeout = 60
timeout_method = "thread"
